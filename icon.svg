<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0033"/>
      <stop offset="50%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <circle cx="120" cy="130" r="3" fill="#fff" opacity="0.9"/>
  <circle cx="380" cy="100" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="440" cy="200" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="80" cy="380" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="420" cy="400" r="3" fill="#fff" opacity="0.9"/>
  <circle cx="300" cy="60" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="60" cy="230" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="460" cy="320" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="200" cy="450" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="350" cy="470" r="1.5" fill="#fff" opacity="0.5"/>
  
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>
  
  <text x="256" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="280" font-weight="900" text-anchor="middle" fill="url(#letter)" filter="url(#shadow)">ب</text>
  
  <circle cx="256" cy="256" r="200" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.4"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.3" stroke-dasharray="8 12"/>
</svg>
